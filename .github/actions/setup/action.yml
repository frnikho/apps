name: Setup Bun
description: Install Bun, restore the dependency cache and install with a frozen lockfile.

inputs:
  bun-version:
    description: Bun version
    required: true

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}
    # Hosted runners are ephemeral, so the dependency cache lives in GitHub's remote cache.
    - uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ inputs.bun-version }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-${{ inputs.bun-version }}-
    - run: bun install --frozen-lockfile
      shell: bash
